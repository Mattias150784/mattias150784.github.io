<!doctype html>
<html lang="en">
<head>
    <title>Request Commission</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
    <style>
        body {
             background-image: url('img/background_two.png');
            background-size: cover;
            background-position: center;
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: rgba(50, 50, 50, 0.9); /* Dark gray background */
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
            max-width: 600px;
            width: 100%;
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        textarea, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            background-color: #333; /* Darker gray for input fields */
            color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        .btn {
            background-color: #123e68;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #0f3153;
        }

        .btn-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-home {
            background-color: #28a745;
        }

        .btn-home:hover {
            background-color: #1e7e34;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Request a mod you would like made!</h1>
    <form id="commissionForm" action="https://formsubmit.co/mattiasayenew@gmail.com" method="POST">
        <label for="description">Description:</label>
        <textarea id="description" name="Description" rows="5" placeholder="Write details about what the mod is about" required></textarea>

        <label for="quote">Quote:</label>
        <input id="quote" name="Quote" type="number" placeholder="Write your budget down. This can be negotiable in the future." required>

        <label for="contact">Contact Information:</label>
        <textarea id="contact" name="Contact" rows="3" placeholder="Any way to reach you: Discord, CurseForge, Email, PlanetMC." required></textarea>

        <div class="btn-wrapper">
            <a href="index.html" class="btn btn-home">Back to Home</a>
            <button type="submit" class="btn">Submit</button>
        </div>

        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://mattias150784.github.io/thank-you.html">
    </form>
</div>

<script>
    document.getElementById("commissionForm").addEventListener("submit", function(event) {
        event.preventDefault();
        fetch("https://discord.com/api/webhooks/1334012133918244894/rcCB5Kup-9eA7mGcQd5PkNEQ8K2B7KNR5kZnyTtekEn-XwotV9sB5vXQjMOEYoa1FPUS", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                content: "New Commission: Check Your Email!"
            })
        }).then(() => {
            event.target.submit();
        }).catch(error => {
            console.error("Discord webhook error:", error);
            event.target.submit();
        });
    });
</script>
</body>
</html>
