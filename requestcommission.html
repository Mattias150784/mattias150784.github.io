<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Commission</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* ——— MOVING DARK PURPLE / BLACK BACKGROUND ——— */
        body {
            background: #000;
            position: relative;
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg,
                #0d001a 0%,
                #1a0033 15%,
                #4b0082 35%,
                #1c002c 60%,
                #0a0014 80%,
                #000000 100%
            );
            background-size: 400% 400%;
            animation: nebulaFlow 20s ease infinite;
            z-index: -2;
        }

        .bg-animation::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 50%, rgba(138, 43, 226, 0.3), transparent 50%),
                        radial-gradient(circle at 70% 30%, rgba(75, 0, 130, 0.2), transparent 60%);
            animation: pulseGlow 12s ease-in-out infinite;
        }

        @keyframes nebulaFlow {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; }
            50%      { opacity: 1; }
        }

        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image:
                radial-gradient(2px 2px at 20% 30%, rgba(186, 85, 211, 0.5), transparent),
                radial-gradient(3px 3px at 60% 70%, rgba(147, 112, 219, 0.4), transparent),
                radial-gradient(2px 2px at 90% 10%, rgba(218, 112, 214, 0.5), transparent);
            background-size: 300% 300%;
            animation: float 35s linear infinite;
        }

        @keyframes float {
            0%   { transform: translateY(0) translateX(0); }
            100% { transform: translateY(-100vh) translateX(50px); }
        }

        /* Centered Page Container */
        .page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Glassmorphic Card */
        .content-card {
            background: rgba(20, 0, 40, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 2.5rem 3rem;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(147, 112, 219, 0.2);
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-title {
            font-family: 'Orbitron', monospace;
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #c797eb, #9a67ea, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { filter: drop-shadow(0 0 10px rgba(138, 43, 226, 0.6)); }
            to   { filter: drop-shadow(0 0 20px rgba(186, 85, 211, 0.8)); }
        }

        .subtitle {
            color: #d8c4e8;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        /* Form Elements */
        .form-container {
            text-align: left;
            width: 100%;
        }

        label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
            color: #d8c4e8;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.5rem;
            border: none;
            border-radius: 8px;
            background-color: rgba(30, 0, 60, 0.5);
            color: white;
            border: 1px solid rgba(147, 112, 219, 0.4);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            font-family: 'Poppins', sans-serif;
        }

        textarea::placeholder, input::placeholder {
            color: rgba(216, 196, 232, 0.7);
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: rgba(186, 85, 211, 0.7);
            box-shadow: 0 0 0 3px rgba(186, 85, 211, 0.3);
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.8rem 1.8rem;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            font-size: 1rem;
            text-align: center;
        }

        .btn-submit {
            background: linear-gradient(135deg, #9a67ea, #8a2be2);
            color: white;
            border: none;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.4);
        }

        .btn-home {
            background: rgba(0, 31, 63, 0.8);
            border: 1px solid rgba(100, 150, 255, 0.3);
            color: white;
        }

        .btn-home:hover {
            background: rgba(0, 50, 100, 0.9);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(100, 150, 255, 0.3);
        }

        @media (max-width: 768px) {
            .main-title { font-size: 2.5rem; }
            .content-card { padding: 2rem 1.5rem; }
            .btn-container { flex-direction: column; gap: 1rem; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

<!-- Moving Background Layers -->
<div class="bg-animation"></div>
<div class="particles"></div>

<div class="page-container">
    <div class="content-card">
        <h1 class="main-title">Request Commission</h1>
        <p class="subtitle">Fill out the form below to request a custom mod.</p>

        <form id="commissionForm" action="https://formsubmit.co/mattiasayenew@gmail.com" method="POST" class="form-container">
            <label for="description">Description:</label>
            <textarea id="description" name="Description" rows="5" placeholder="Write details about what the mod is about" required></textarea>

            <label for="quote">Budget:</label>
            <input id="quote" name="Quote" type="number" placeholder="Write your budget down. This can be negotiable in the future." required>

            <label for="contact">Contact Information:</label>
            <textarea id="contact" name="Contact" rows="3" placeholder="Any way to reach you: Discord, CurseForge, Email, PlanetMC." required></textarea>

            <div class="btn-container">
                <a href="index.html" class="btn btn-home">← Back to Home</a>
                <button type="submit" class="btn btn-submit">Submit Request</button>
            </div>

            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://mattias150784.github.io/thank-you.html">
        </form>
    </div>
</div>

<script>
    document.getElementById("commissionForm").addEventListener("submit", function(event) {
        event.preventDefault();
        fetch("https://discord.com/api/webhooks/1334012133918244894/rcCB5Kup-9eA7mGcQd5PkNEQ8K2B7KNR5kZnyTtekEn-XwotV9sB5vXQjMOEYoa1FPUS", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                content: "New Commission Request: Check Your Email!"
            })
        }).then(() => {
            event.target.submit();
        }).catch(error => {
            console.error("Discord webhook error:", error);
            event.target.submit();
        });
    });
</script>
</body>
</html>
